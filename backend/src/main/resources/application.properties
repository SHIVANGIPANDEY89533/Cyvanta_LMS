spring.config.import=optional:file:.env[.properties]
spring.application.name=backend
server.port=8080

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DB:lmsdb}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:cyvanta_lms}

file.upload-dir=${FILE_UPLOAD_DIR:uploads}

jitsi.domain=${JITSI_DOMAIN:meet.jit.si}
jitsi.app-id=${JITSI_APP_ID}
jitsi.app-secret=${JITSI_APP_SECRET}

youtube.client-id=${YOUTUBE_CLIENT_ID}
youtube.client-secret=${YOUTUBE_CLIENT_SECRET}
youtube.redirect-uri=${YOUTUBE_REDIRECT_URI:http://localhost:8080/api/youtube/callback}
youtube.scope=${YOUTUBE_SCOPE:https://www.googleapis.com/auth/youtube.upload}
youtube.credentials-dir=${YOUTUBE_CREDENTIALS_DIR:.oauth-credentials}
youtube.user-id=${YOUTUBE_USER_ID:cyvanta-admin}